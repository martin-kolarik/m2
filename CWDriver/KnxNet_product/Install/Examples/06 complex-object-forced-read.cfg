[device]
id = eibnet:192.168.1.1
mode = tunneling

[behaviours]
behaviour = transmitter_with_status_read, transmit, updateable, writable, readable, communicate_on_read
behaviour = transmitter_with_status_read_init, transmit, updateable, writable, readable, communicate_on_read, read_on_start

[objects]
object = transmitter_with_status_read, switch, 3/0/1, r3/1/1, 6/0/0, 6/0/1
object = transmitter_with_status_read, switch, 3/0/2, r3/1/2, 6/0/0, 6/0/1

object = transmitter_with_status_read_init, switch, 3/0/3, r3/1/3, 6/0/0, 6/0/1
object = transmitter_with_status_read_init, switch, 3/0/4, r3/1/4, 6/0/0, 6/0/1

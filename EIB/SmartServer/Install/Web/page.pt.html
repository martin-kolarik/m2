<!-- pageTemplate xmlns:pt="http://www.smartcontrol.cz/2008/XML/Web/PageTemplate" -->
  <html>
      <head>
          <title>NeNo KNX/EIBSrv</title>
          <link rel="StyleSheet" type="text/css" href="NeNo.css" />
      </head>
      <body>
          <div class="shell">
              <div class="shell-topstrip"></div>
              <div class="canvas">

                  <div class="top">
                  </div>

                  <div class="middle">
                      <div id="menu">
                          <p>Přehled</p>
                          <p>Řízení</p>
                          <p>Stav</p>
                          <p>Přímý přístup</p>
                      </div>

                      <div class="content">

                        <h1>Server</h1>
                        <table cellpadding="0px" cellspacing="0px">
                          <tr>
                            <td>Spojení s EIB</td><td class="spare">&nbsp;</td><td>
                              <pt:choose>
                                <pt:when condition="${connected}">Připojeno ${connectedTime}</pt:when>
                                <pt:otherwise><span class="red">Nepřipojeno</span></pt:otherwise>
                              </pt:choose>
                            </td>
                          <tr>
                          </tr>
                          <tr>
                            <td>Doba běhu serveru</td><td class="spare">&nbsp;</td><td>15 hod.</td>
                          <tr>
                          </tr>
                            <td>Konfigurace</td><td class="spare">&nbsp;</td><td>Default.cfg</td>
                          <tr>
                          </tr>
                            <td>Licence</td><td class="spare">&nbsp;</td><td>Neomezeno</td>
                          </tr>
                        </table>

                        <h1>Komunikace</h1>
                        <table cellpadding="0px" cellspacing="0px">
                          <tr>
                            <td>Za poslední hodinu</td><td class="spare">&nbsp;</td><td>15</td>
                          </tr>
                          <tr>
                            <td>Za poslední den</td><td class="spare">&nbsp;</td><td>365</td>
                          </tr>
                        </table>

                      </div>
                  </div>

                  <div class="bottom">
                    <p>EIB/KNX SmartServer &copy; NeNo</p>
                  </div>

              </div>
          </div>
      </body>
  </html>

;==============================================================================
; Default values are denoted with *. Lines without ; on the start have no
; default value and should be present/defined.

;==============================================================================
; [sdap] specifies adress of SDAP server, with which data (group adressed) will be communicated
[sdap]
; host = address of SDAP server
; host = 192.168.1.1:6007
host = 192.168.1.253:6007

;==============================================================================
; [devices] specifies list of device used later
[devices]
; deviceIdentifier = device description text
; pump1 = Left Stiebel Eltron Heat Pump
; pump2 = Right Stiebel Eltron Heat Pump

;==============================================================================
; [device_deviceIdentifier] sections, these sections are multiple and they
; are named by [devices] section. Each of devices defined in [devices]
; should have self section.
[device_pump1]
; library = file path to DLL with device driver
; library = stiebelhp.dll
; host = address of TCP-connected RS-232 convertor connected to the device
; host = 192.168.1.252:10001
library = StiebelHp.dll
host = 192.168.1.252:10001

; [device_pump2]
; library = StiebelHp.dll
; host = 192.168.1.253:10001

;==============================================================================
; [sdap_to_device] specifies list of data points transferred from SDAP to device
[sdap_to_device]
; deviceIdentifier/dataPointName = SDAP group address
; pump1/StiebelHP.Data.OperatingMode = 13/7/0
; pump1/StiebelHP.Data.EquithermicCurve = 13/7/1
; pump1/StiebelHP.Data.Inner T setpoint = 13/7/2
; pump1/StiebelHP.Data.Return T setpoint = 13/7/3
pump1/StiebelHP.Data.Water T setpoint = 13/7/4
pump2/StiebelHP.Data.Water T setpoint = 13/7/5

;==============================================================================
; [device_to_sdap] specifies list of data points transferred from device to SDAP
[device_to_sdap]
; SDAP group address = deviceIdentifier/dataPointName
13/6/0 = pump1/StiebelHP.Data.OperatingMode
13/6/1 = pump1/StiebelHP.Data.EquithermicCurve
13/6/2 = pump1/StiebelHP.Data.Inner T setpoint
13/6/3 = pump1/StiebelHP.Data.Outer T
13/6/4 = pump1/StiebelHP.Data.Return T
13/6/5 = pump1/StiebelHP.Data.Return T setpoint
13/6/6 = pump1/StiebelHP.Data.Output T
13/6/7 = pump1/StiebelHP.Data.Water T
13/6/8 = pump1/StiebelHP.Data.Water T setpoint

;==============================================================================
; global log
[log]
; target = *kernel | file | none
; level = fatal | *error | warning | info
level = info

;==============================================================================
; list of all known StiebelHP data points
; R/W StiebelHP.Data.OperatingMode = 0 = emergency | 1 = standby | 2 = automatic | 3 = night | 4 = damping | 5 = hot water only
; R/W StiebelHP.Data.EquithermicCurve = 0.5..2.0?
; 
; R/W StiebelHP.Data.Inner T setpoint = temperature (°C)
; R/O StiebelHP.Data.Outer T = temperature (°C)
; R/O StiebelHP.Data.Return T = temperature (°C)
; R/W StiebelHP.Data.Return T setpoint = temperature (°C)
; R/O StiebelHP.Data.Output T = temperature (°C)
; 
; R/O StiebelHP.Data.Water T = temperature (°C)
; R/W StiebelHP.Data.Water T setpoint = temperature (°C)
;
; R/W StiebelHP.Data.Error occurred = boolean, status, reset of new error occurence
;
; R/O StiebelHP.Data.Error 01 Code = code of error
; R/O StiebelHP.Data.Error 01 Date = date of error
; R/O StiebelHP.Data.Error 01 Time = time of error
; ...
; ... up to 20 error records:
; ...
; R/O StiebelHP.Data.Error 20 Code = code of error
; R/O StiebelHP.Data.Error 20 Date = date of error
; R/O StiebelHP.Data.Error 20 Time = time of error
